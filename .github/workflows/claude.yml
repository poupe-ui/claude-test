name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      github.actor == 'amery' &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      # Claude pushes with the Claude GitHub App's token, not this
      # job's, so the job itself only reads the code.
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # Claude's push goes to this repository, never to a fork, and a
      # fork's code must not run here. On a fork's pull request Claude
      # only reads and replies: no toolchain, no make, and an App token
      # that cannot push. Anything but an explicit "false" counts as a
      # fork.
      - name: Check whether the pull request comes from a fork
        id: origin
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || '' }}
        run: |
          fork=false
          if [ -n "$PR" ]; then
            fork=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)
          fi
          echo "detected fork=$fork, forcing true for the trial"
          fork=true
          echo "fork=$fork" | tee -a "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # Left in place, this job's token is what Claude pushes with,
          # and a push by github-actions[bot] waits for approval
          # before it starts any workflow.
          persist-credentials: false

      # Standing in for darvaza-proxy/x's toolchain, so that make runs.
      - uses: actions/setup-node@v7
        if: steps.origin.outputs.fork == 'false'
        with:
          node-version: '24'

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
            contents: ${{ steps.origin.outputs.fork == 'false' && 'write' || 'read' }}
          claude_args: ${{ steps.origin.outputs.fork == 'false' && '--allowedTools "Bash(make:*)"' || '' }}
          show_full_output: true

      # The last background_tasks_changed record lists the tasks still
      # running when the session ended; any left over were abandoned.
      - name: Fail on abandoned background tasks
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then
            echo 'No execution file; the action did not get far enough to produce one.'
            exit 0
          fi
          outstanding=$(jq -s '[.. | objects
            | select(.subtype? == "background_tasks_changed")
            | .tasks | length] | last // 0' "$EXECUTION_FILE")
          if [ "$outstanding" -gt 0 ]; then
            echo "The session ended with $outstanding background task(s) still running."
            exit 1
          fi
          echo 'No background tasks left running.'
