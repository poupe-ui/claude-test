name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    if: github.actor != 'renovate[bot]' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # 0 so the review can diff the head against the base commit;
          # a depth-1 checkout leaves it with nothing to compare.
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The whole point of this repository: the SDK output is
          # hidden by default, which is why denied tools cannot be
          # named from a normal run.
          show_full_output: true

      # A denied tool call leaves the review half-done, but the action
      # still reports success — which is how eight broken runs went
      # unnoticed in eslint-plugin-tailwindcss. Fail loudly instead.
      - name: Fail on permission denials
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then
            echo 'No execution file; the action did not get far enough to produce one.'
            exit 0
          fi
          jq -r '[.. | objects | select(has("permission_denials")) | .permission_denials[]]
                 | unique_by(.tool_use_id)
                 | .[] | "\(.tool_name)  \(.tool_input | tostring)"' \
            "$EXECUTION_FILE" > denials.txt
          if [ -s denials.txt ]; then
            echo 'Claude Code was denied these tool calls:'
            cat denials.txt
            exit 1
          fi
          echo 'No permission denials.'
