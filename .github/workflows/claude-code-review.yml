name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    if: github.actor != 'renovate[bot]' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request with a focus on:
            - Code quality and best practices
            - Potential bugs or issues
            - Security implications
            - Performance considerations

            Note: The PR branch is already checked out in the current
            working directory.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment`
            (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as
            messages.

            Post a top-level comment even when you find nothing, so
            that silence always means the job failed rather than that
            the change was clean.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          # The whole point of this repository: the SDK output is
          # hidden by default, which is why denied tools cannot be
          # named from a normal run.
          show_full_output: true

      # A denied tool call leaves the review half-done, but the action
      # still reports success — which is how eight broken runs went
      # unnoticed in eslint-plugin-tailwindcss. Fail loudly instead.
      - name: Fail on permission denials
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          # Tools denied deliberately above, so their denials would be
          # the configuration working rather than a fault. Empty now
          # that the allow-list is scoped to what the review needs.
          EXPECTED_DENIALS: ''
        run: |
          if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then
            echo 'No execution file; the action did not get far enough to produce one.'
            exit 0
          fi
          jq -r --arg expected "$EXPECTED_DENIALS" '
            ($expected | split(",")) as $ok
            | [.. | objects | select(has("permission_denials")) | .permission_denials[]]
            | unique_by(.tool_use_id)
            | map(select(.tool_name as $n | $ok | index($n) | not))
            | .[] | "\(.tool_name)  \(.tool_input | tostring)"' \
            "$EXECUTION_FILE" > denials.txt
          if [ -s denials.txt ]; then
            echo 'Claude Code was denied these tool calls:'
            cat denials.txt
            exit 1
          fi
          echo 'No unexpected permission denials.'

      # Zero denials and a clean exit still say nothing about whether a
      # review happened: the run that prompted this check ended green,
      # mid-flow, having posted nothing at all.
      - name: Fail when the review posted nothing
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --jq '.[].user.login' > authors.txt
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/comments" --jq '.[].user.login' >> authors.txt
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews" --jq '.[].user.login' >> authors.txt
          if grep -qi claude authors.txt; then
            echo 'Review present.'
            exit 0
          fi
          echo 'The job finished without posting a review.'
          exit 1
